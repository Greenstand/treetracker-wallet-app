apiVersion: v1
kind: Namespace
metadata:
  name: wallet-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: treetracker-wallet-app
  namespace: wallet-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: treetracker-wallet-app
  template:
    metadata:
      labels:
        app: treetracker-wallet-app
    spec:
      containers:
        - name: web
          image: treetracker-wallet-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: treetracker-wallet-app
  namespace: wallet-app
spec:
  selector:
    app: treetracker-wallet-app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: treetracker-wallet-app
  namespace: wallet-app
spec:
  hostname: "*"
  prefix: /wallet/
  rewrite: /
  service: treetracker-wallet-app.wallet-app:80
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: treetracker-wallet-app-root
  namespace: wallet-app
spec:
  hostname: "*"
  prefix: /wallet
  prefix_exact: true
  rewrite: /
  service: treetracker-wallet-app.wallet-app:80
